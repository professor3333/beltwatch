[project]
name = "beltwatch"
version = "0.1.0"
description = "Visual contamination auditing for paper-recycling conveyor lines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Niroj33" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beltwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests excluded from PR CI",
]
