[project]
name = "beltwatch"
version = "0.1.0"
description = "Visual contamination auditing for paper-recycling conveyor lines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Niroj33" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Pick exactly one PyTorch build: `uv sync --extra cpu` (CI, laptops, CPU serving)
# or `uv sync --extra cu126` (NVIDIA GPU training machines).
cpu = ["torch>=2.14,<2.15"]
cu126 = ["torch>=2.14,<2.15"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]
pipeline = [
    "dvc>=3.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beltwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests excluded from PR CI",
]

[tool.uv]
# Install the DVC pipeline group locally by default; CI opts out with --no-group.
default-groups = ["dev", "pipeline"]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
