[project]
name = "beltwatch"
version = "0.1.0"
description = "Visual contamination auditing for paper-recycling conveyor lines"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Niroj33" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "mlflow-skinny>=3.0",
    "numpy>=2.0",
    "pillow>=10.4",
    "prometheus-client>=0.20",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "scikit-image>=0.24",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "transformers>=5.0,<6",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Pick exactly one PyTorch build: `uv sync --extra cpu` (CI, laptops, CPU serving)
# or `uv sync --extra cu126` (NVIDIA GPU training machines).
cpu = ["torch>=2.14,<2.15", "torchvision>=0.29,<0.30"]
cu126 = ["torch>=2.14,<2.15", "torchvision>=0.29,<0.30"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]
pipeline = [
    "dvc>=3.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beltwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Notebook cells hold full shell commands, which read better unwrapped.
"notebooks/*.ipynb" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Third-party packages without type information.
module = ["joblib", "sklearn.*", "skimage.*", "torchvision.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests excluded from PR CI",
]
filterwarnings = [
    # Raised inside MLflow's own SQLAlchemy models, not by BeltWatch code.
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
    # Starlette's test client notice about its HTTP library; not BeltWatch code.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.uv]
# Install the DVC pipeline group locally by default; CI opts out with --no-group.
default-groups = ["dev", "pipeline"]
conflicts = [[{ extra = "cpu" }, { extra = "cu126" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cu126" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
