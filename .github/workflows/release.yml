name: release

# Validates a declared release (configs/releases/<version>.yaml) in CI, then
# benchmarks it on the planning host (benchmark.yml). Runs on a version tag
# (v0.1.0 -> beltwatch-0.1.0) or by hand. The validation:
#   1. the weights match the declared SHA-256;
#   2. temperature scaling refitted on the calibration split reproduces the
#      declared temperature;
#   3. val re-scored at that temperature reproduces the declared foreground
#      macro IoU (within the declaration's tolerance);
#   4. the bundle built from these outputs matches the declaration;
#   5. runtime parity: the bundle, loaded as the worker loads it, predicts what
#      the evaluated checkpoint predicts on real val frames.
# The val folder (images and masks) is fetched from the pinned archive by
# range request and checked against the committed manifest. The test split is
# never fetched or scored here. Only JSON reports are uploaded; weights,
# frames, masks and per-image tables stay on the runner.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: Release declared in configs/releases/
        default: beltwatch-0.1.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      release: ${{ steps.release.outputs.release }}
    env:
      DATASET: ${{ vars.KAGGLE_CHECKPOINTS_DATASET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the release
        id: release
        env:
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then release="beltwatch-${GITHUB_REF_NAME#v}"; else release="$INPUT_RELEASE"; fi
          [[ "$release" =~ ^[a-z0-9.-]+$ ]] && test -f "configs/releases/$release.yaml" \
            || { echo "no declaration configs/releases/$release.yaml"; exit 1; }
          [[ "$DATASET" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+$ ]] \
            || { echo "set the repository variable KAGGLE_CHECKPOINTS_DATASET (owner/slug)"; exit 1; }
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "RELEASE=$release" >> "$GITHUB_ENV"
          echo "WORK=$RUNNER_TEMP/release" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra cpu --no-group pipeline

      - name: Read the declaration
        run: |
          uv run python - "configs/releases/$RELEASE.yaml" >> "$GITHUB_ENV" <<'EOF'
          import sys
          from beltwatch.release.declaration import load_declaration
          d = load_declaration(__import__("pathlib").Path(sys.argv[1]))
          t = d.calibration.temperature
          print(f"MODEL_KIND={d.model.kind}")
          print(f"CHECKPOINT={d.model.checkpoint}")
          print(f"FIT_SCOPE={d.calibration.fit_scope}")
          print("TEMPERATURE=" + (",".join(map(str, t)) if isinstance(t, (list, tuple)) else str(t)))
          EOF

      - name: Fetch the declared weights from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          dir=$(scripts/fetch_kaggle_checkpoint.sh "$DATASET" "$CHECKPOINT" "$WORK/checkpoints")
          echo "CHECKPOINT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Check the weights
        run: uv run python -m beltwatch.release.declaration "configs/releases/$RELEASE.yaml" --model "$CHECKPOINT_DIR/best.pt"

      - name: Fetch the val folder from the pinned archive
        # Images and masks of the release's val folder (val and calibration splits),
        # each checked against data/manifests/zerowaste-f-images.csv.
        run: uv run python -m beltwatch.data.sample --split val --whole --out data/raw/zerowaste-f

      - name: Refit the temperature on the calibration split
        run: |
          uv run python -m beltwatch.evaluation.calibration --model "$MODEL_KIND" \
            --model-dir "$CHECKPOINT_DIR" --fit-scope "$FIT_SCOPE" --out "$WORK/out/calibration"
          uv run python -m beltwatch.release.declaration "configs/releases/$RELEASE.yaml" \
            --calibration "$WORK/out/calibration/calibration.json"

      - name: Re-score val at the declared temperature
        run: |
          uv run python scripts/evaluate.py --model "$MODEL_KIND" --model-dir "$CHECKPOINT_DIR" \
            --split val --temperature "$TEMPERATURE" --out-dir "$WORK/out/val"
          report=$(dirname "$(ls "$WORK"/out/val/*-val/report.json)")
          echo "VAL_REPORT=$report/report.json" >> "$GITHUB_ENV"
          uv run python -m beltwatch.release.declaration "configs/releases/$RELEASE.yaml" \
            --val-report "$report/report.json"

      - name: Build the bundle and check it against the declaration
        run: |
          uv run python -m beltwatch.release.bundle --kind "$MODEL_KIND" \
            --model "$CHECKPOINT_DIR/best.pt" --version "$RELEASE" \
            --calibration "$WORK/out/calibration/calibration.json" --evaluation "$VAL_REPORT" \
            --releases-dir "$WORK/releases" --note "Built by the release workflow for validation."
          uv run python -m beltwatch.release.declaration "configs/releases/$RELEASE.yaml" \
            --model "$CHECKPOINT_DIR/best.pt" --calibration "$WORK/out/calibration/calibration.json" \
            --val-report "$VAL_REPORT" --release-dir "$WORK/releases/$RELEASE"
          cp "$WORK/releases/$RELEASE/manifest.json" "$WORK/out/manifest.json"

      - name: Runtime parity on val frames
        run: |
          uv run python -m beltwatch.release.parity --release "$WORK/releases/$RELEASE" \
            --model "$MODEL_KIND" --model-dir "$CHECKPOINT_DIR" --temperature "$TEMPERATURE" \
            --images data/raw/zerowaste-f/splits_final_deblurred/val/data --n 5 | tee "$WORK/out/parity.txt"
          grep -qx parity "$WORK/out/parity.txt"

      - name: Summary
        run: |
          uv run python - "$VAL_REPORT" "$WORK/out/calibration/calibration.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          r, c = (json.load(open(p)) for p in sys.argv[1:])
          s = r["segmentation"]
          print(f"### {r['model']} on val ({r['n_images']} images), commit {r['provenance']['git_commit'][:7]}\n")
          print(f"- foreground macro IoU {s['foreground_macro_iou']:.5f} at T {r['temperature']}")
          print(f"- refitted temperature {c['temperature']} on {c['n_images']} calibration images")
          print(f"- coverage MAE {r['coverage']['total_mae_pp']:.2f} pp")
          print("- weights, calibration, val score, bundle and parity match the declaration")
          EOF

      - name: Upload the reports (JSON only)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-validation-${{ steps.release.outputs.release }}
          path: |
            ${{ runner.temp }}/release/out/**/*.json
            ${{ runner.temp }}/release/out/parity.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Remove the weights and data
        if: always()
        run: rm -rf "$WORK" data/raw

  benchmark:
    needs: validate
    uses: ./.github/workflows/benchmark.yml
    with:
      kaggle_dataset: ${{ vars.KAGGLE_CHECKPOINTS_DATASET }}
      release: ${{ needs.validate.outputs.release }}
    secrets:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
