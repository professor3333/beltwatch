name: benchmark

# Benchmarks a declared release on the planning host: a GitHub-hosted runner
# (4 vCPU and 16 GB on a public repository) with the serving image limited to
# 4 CPUs and 8 GB, and the compose stack to 5.5 GB in total
# (docker/benchmark.compose.yaml). It records:
#   1. the in-container benchmark of the bundle (as on Kaggle: 20 val frames,
#      4 threads), against which the engineering targets are judged;
#   2. end-to-end times through the HTTPS proxy, API, queue and worker, one
#      audit at a time and with four in flight;
#   3. the CPU model, limits and cgroup memory peaks.
#
# Started by hand only. The weights come from the owner's private Kaggle
# Dataset (repository secret KAGGLE_API_TOKEN), the frames from the pinned
# Zenodo archive by range request. Neither is uploaded or printed: the only
# artifact is the JSON record. See docs/operations.md.
on:
  workflow_dispatch:
    inputs:
      kaggle_dataset:
        description: Private Kaggle Dataset with the checkpoint folders (owner/slug)
        required: true
      release:
        description: Release declared in configs/releases/
        default: beltwatch-0.1.0
  workflow_call:  # from release.yml, after the release is validated
    inputs:
      kaggle_dataset:
        type: string
        required: true
      release:
        type: string
        required: true
    secrets:
      KAGGLE_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: benchmark-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE: ${{ inputs.release }}
      DATASET: ${{ inputs.kaggle_dataset }}
      BELTWATCH_GIT_COMMIT: ${{ github.sha }}
      COMPOSE_FILE: compose.yaml:docker/benchmark.compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the inputs
        run: |
          [[ "$RELEASE" =~ ^[a-z0-9.-]+$ ]] && test -f "configs/releases/$RELEASE.yaml"
          [[ "$DATASET" =~ ^[A-Za-z0-9_-]+/[A-Za-z0-9_.-]+$ ]]
          test -f "docs/results/$RELEASE/calibration.json"
          test -f "docs/results/$RELEASE/val/release.json"
          WORK="$RUNNER_TEMP/benchmark"
          mkdir -p "$WORK"/{checkpoints,frames,out,peaks}
          chmod 777 "$WORK/frames" "$WORK/out"  # written by the image's non-root user
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Host
        run: lscpu && free -m && uname -r && docker version --format '{{.Server.Version}}'

      - name: Build the image
        run: docker compose build

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Fetch the declared weights from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          read -r name kind < <(docker compose run --rm --no-deps -T api python -c \
            "import sys, yaml; m = yaml.safe_load(open(sys.argv[1]))['model']; print(m['checkpoint'], m['kind'])" \
            "configs/releases/$RELEASE.yaml")
          dir=$(scripts/fetch_kaggle_checkpoint.sh "$DATASET" "$name" "$WORK/checkpoints")
          echo "CHECKPOINT_DIR=$dir" >> "$GITHUB_ENV"
          echo "MODEL_KIND=$kind" >> "$GITHUB_ENV"

      - name: Fetch 20 val frames from the pinned archive
        run: |
          docker compose run --rm --no-deps -v "$WORK/frames:/frames" api \
            python -m beltwatch.data.sample --split val --count 20 --out /frames

      - name: Build the bundle and check it against the declaration
        run: |
          mkdir -p model_releases
          run() {
            docker compose run --rm --no-deps --user root \
              -v "$CHECKPOINT_DIR:/checkpoint:ro" -v "$PWD/docs/results/$RELEASE:/results:ro" \
              api "$@"
          }
          run python -m beltwatch.release.bundle --kind "$MODEL_KIND" --model /checkpoint/best.pt \
            --version "$RELEASE" --calibration /results/calibration.json \
            --evaluation /results/val/release.json --releases-dir /releases \
            --note "Rebuilt from the declared weights for the host benchmark; not a promotion."
          run python -m beltwatch.release.declaration "configs/releases/$RELEASE.yaml" \
            --model /checkpoint/best.pt --calibration /results/calibration.json \
            --val-report /results/val/release.json --release-dir "/releases/$RELEASE"
          run python -m beltwatch.release.activate "$RELEASE" \
            --reason "host benchmark" --releases-dir /releases

      - name: Benchmark the bundle in the image (4 CPUs, 8 GB)
        run: |
          docker run --rm --cpus 4 --memory 8g --memory-swap 8g \
            -v "$PWD/model_releases:/releases:ro" -v "$WORK/frames:/frames:ro" -v "$WORK/out:/out" \
            "beltwatch:${BELTWATCH_IMAGE_TAG:-local}" \
            python -m beltwatch.evaluation.benchmark --release "/releases/$RELEASE" \
            --images /frames --threads 4 --iterations 20 --out /out/benchmark.json

      - name: Start the stack
        run: docker compose up -d --wait api worker proxy

      - name: Smoke test
        run: |
          python3 scripts/deploy_smoke.py --base-url https://localhost --insecure \
            --expect-version "$RELEASE" --ready-timeout 180

      - name: End to end, one audit at a time
        run: |
          python3 scripts/soak_test.py --base-url https://localhost --insecure --audits 40 \
            --in-flight 1 --replay-every 0 --images "$WORK"/frames/*.[Pp][Nn][Gg] \
            --out "$WORK/out/sequential.json"

      - name: End to end, four in flight
        # Another seed: the regions must differ from the first run's, or its
        # audits would be served from the result cache.
        run: |
          python3 scripts/soak_test.py --base-url https://localhost --insecure --audits 60 \
            --in-flight 4 --replay-every 0 --seed 1 --images "$WORK"/frames/*.[Pp][Nn][Gg] \
            --out "$WORK/out/saturated.json"

      - name: Limits and memory peaks
        run: |
          for service in api worker proxy; do
            docker compose exec -T "$service" cat /sys/fs/cgroup/memory.peak > "$WORK/peaks/$service" \
              || echo unavailable > "$WORK/peaks/$service"
          done
          mapfile -t ids < <(docker compose ps -q)
          docker inspect "${ids[@]}" > "$WORK/out/inspect.json"

      - name: Assemble the record
        run: |
          python3 scripts/benchmark_record.py --benchmark "$WORK/out/benchmark.json" \
            --end-to-end "sequential=$WORK/out/sequential.json" \
            --end-to-end "saturated=$WORK/out/saturated.json" \
            --containers "$WORK/out/inspect.json" --memory-peaks "$WORK/peaks" \
            --frames "$WORK/frames/frames.json" --out "$WORK/out/benchmark-host.json"
          python3 - "$WORK/out/benchmark-host.json" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1]))
          b, e = r["benchmark"], r["end_to_end"]
          print(f"### {r['release']} on {r['host']['cpu_model']} ({r['host']['cpu_count']} vCPU)\n")
          print("| Measure | Value | Target |\n|---|---|---|")
          print(f"| Full pipeline p50 / p95 | {b['full_pipeline']['p50_seconds']} / {b['full_pipeline']['p95_seconds']} s | p95 ≤ 3 s |")
          print(f"| Throughput | {b['images_per_second']} img/s | ≥ 0.5 |")
          print(f"| Peak RSS | {b['peak_rss_mb']} MB | ≤ 2048 |")
          for name, run in e.items():
              s = run["seconds_to_finish"]
              print(f"| End to end, {name} (p50 / p95) | {s['p50']:.2f} / {s['p95']:.2f} s, {run['audits_per_second']} audits/s | reported only |")
          print(f"\nMeets targets: {b['meets_targets']}")
          EOF

      - name: Upload the record (JSON only; no weights or frames)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-host-${{ inputs.release }}
          path: |
            ${{ runner.temp }}/benchmark/out/benchmark-host.json
            ${{ runner.temp }}/benchmark/out/sequential.json
            ${{ runner.temp }}/benchmark/out/saturated.json
          if-no-files-found: error
          retention-days: 30

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: |
          docker compose down -v
          sudo rm -rf "$WORK" model_releases
