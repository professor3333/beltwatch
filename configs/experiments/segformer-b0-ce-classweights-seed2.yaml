# Experiment: configs/segformer_b0.yaml with two declared changes (a test enforces
# that nothing else differs). Plan and selection rule: docs/training.md §6, round 2.
# Changes: seed 2, and the class weights of segformer-b0-ce-classweights.yaml
# (derivation there). A fresh seed to confirm the round-1 near miss of class weights.
run_name: segformer-b0-ce-classweights-seed2
data_config: configs/data.yaml
output_dir: models/segformer-b0-ce-classweights-seed2

model:
  name: segformer_b0
  pretrained: true

preprocess:
  long_side: 768
  pad_multiple: 32

augment:
  crop_size: 512
  scale_range: [0.75, 1.25]
  hflip_prob: 0.5
  brightness: 0.2
  contrast: 0.2
  blur_prob: 0.2
  jpeg_prob: 0.2

optimization:
  epochs: 40
  batch_size: 4
  accumulation_steps: 2
  encoder_lr: 3.0e-5
  head_lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 1
  frozen_encoder_epochs: 2
  grad_clip_norm: 1.0

loss:
  kind: ce
  class_weights: [1.0, 2.8, 4.0, 10.0, 10.0]

evaluation:
  every_epochs: 1

early_stopping_patience: 8

runtime:
  seed: 2
  num_workers: 4
  amp: true
  device: auto

tracking:
  mlflow_uri: sqlite:///mlflow.db
  experiment: beltwatch
