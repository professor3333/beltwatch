# Experiment: configs/segformer_b0.yaml with one declared change (a test enforces
# that nothing else differs). Plan and selection rule: docs/training.md.
# Change: restrained class weights in the cross-entropy. Train pixel shares
# (data/manifests, split train): background 83.57%, cardboard 10.55%, soft
# plastic 5.17%, rigid plastic 0.62%, metal 0.09%. Weight = sqrt(background
# share / class share), capped at 10, rounded to one decimal.
# Aimed at rigid plastic and metal (docs/error_analysis.md, findings 1 and 2).
run_name: segformer-b0-ce-classweights
data_config: configs/data.yaml
output_dir: models/segformer-b0-ce-classweights

model:
  name: segformer_b0
  pretrained: true

preprocess:
  long_side: 768
  pad_multiple: 32

augment:
  crop_size: 512
  scale_range: [0.75, 1.25]
  hflip_prob: 0.5
  brightness: 0.2
  contrast: 0.2
  blur_prob: 0.2
  jpeg_prob: 0.2

optimization:
  epochs: 40
  batch_size: 4
  accumulation_steps: 2
  encoder_lr: 3.0e-5
  head_lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 1
  frozen_encoder_epochs: 2
  grad_clip_norm: 1.0

loss:
  kind: ce
  class_weights: [1.0, 2.8, 4.0, 10.0, 10.0]

evaluation:
  every_epochs: 1

early_stopping_patience: 8

runtime:
  seed: 0
  num_workers: 4
  amp: true
  device: auto

tracking:
  mlflow_uri: sqlite:///mlflow.db
  experiment: beltwatch
