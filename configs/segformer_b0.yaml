# SegFormer-B0 (MiT-B0 encoder, ImageNet-pretrained by NVIDIA): the transformer challenger.
# Data, preprocessing, augmentation, schedule, and loss match configs/unet.yaml
# so the comparison isolates the architecture. The pretrained weights are for
# noncommercial research and evaluation only (see THIRD_PARTY_NOTICES.md).
run_name: segformer-b0-ce
data_config: configs/data.yaml
output_dir: models/segformer-b0-ce

model:
  name: segformer_b0
  pretrained: true

preprocess:
  long_side: 768
  pad_multiple: 32

augment:
  crop_size: 512
  scale_range: [0.75, 1.25]
  hflip_prob: 0.5
  brightness: 0.2
  contrast: 0.2
  blur_prob: 0.2
  jpeg_prob: 0.2

optimization:
  epochs: 40
  batch_size: 4
  accumulation_steps: 2
  encoder_lr: 3.0e-5
  head_lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 1
  frozen_encoder_epochs: 2
  grad_clip_norm: 1.0

loss:
  kind: ce

evaluation:
  every_epochs: 1

early_stopping_patience: 8

runtime:
  seed: 0
  num_workers: 4
  amp: true
  device: auto

tracking:
  mlflow_uri: sqlite:///mlflow.db
  experiment: beltwatch
