# Pinned source release. Values come from the Zenodo API
# (https://zenodo.org/api/records/6412647) and must not be edited by hand
# except to deliberately move to a new release.
source:
  name: zerowaste-f
  zenodo_record: 6412647
  version: "1.2.1"
  doi: 10.5281/zenodo.6412647
  filename: zerowaste-f-final.zip
  url: https://zenodo.org/api/records/6412647/files/zerowaste-f-final.zip/content
  size_bytes: 7518242799
  md5: e26e31a58080bca6782dca0e56074c5d

# Layout inside the extracted archive (measured from the release's zip index).
layout:
  root_subdir: splits_final_deblurred
  splits: [train, val, test]
  images_subdir: data
  masks_subdir: sem_seg
  annotations_file: labels.json

# Duplicate / near-duplicate audit (reporting only; exclusions happen at split time).
duplicates:
  hash_size: 8              # 8x8 -> 64-bit perceptual hashes
  phash_max_hamming: 6      # pairs at or below this pHash distance are near-duplicates

# Split policy "official-repaired" (decided 2026-10-05, before any model results):
# keep the release's train/val/test for comparability, then repair leakage.
splits:
  policy: official-repaired
  # Whole val sequences moved to a grouped calibration holdout (~200 images).
  calibration_from_val_sequences: ["02", "10"]
  # Drop train frames within this many frames of any val/calibration/test frame
  # in the same sequence (project convention; 500 drops ~114 of 3,002 train frames).
  train_buffer_frames: 500
  # Drop train images that are exact or near-duplicates of any evaluation image.
  exclude_train_duplicates_of_eval: true

# Paths are relative to the repository root.
paths:
  downloads_dir: data/downloads
  raw_dir: data/raw/zerowaste-f
  manifests_dir: data/manifests
  splits_dir: data/splits
